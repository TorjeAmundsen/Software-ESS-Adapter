name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      # The tag must be "v" plus APP_VERSION in CMakeLists.txt, e.g. v0.1.0-alpha.
      - name: Check tag matches version
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'set\(APP_VERSION "([^"]+)"\)').Matches[0].Groups[1].Value
          if ('${{ github.ref_name }}' -cne "v$version") {
            Write-Error "Tag ${{ github.ref_name }} does not match APP_VERSION $version in CMakeLists.txt"
            exit 1
          }

      # MSVC, plus the CMake and Ninja that ship with Visual Studio, on PATH.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: ./build.ps1

      - name: Build tests
        run: cmake --build build/msvc --target bridge-tests

      - name: Run tests
        run: ./build/msvc/bridge-tests.exe

      - name: Name zip
        run: Move-Item dist/software-ess-adapter.zip "dist/software-ess-adapter-${{ github.ref_name }}-win-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: build-win-x64
          path: dist/software-ess-adapter-${{ github.ref_name }}-win-x64.zip
          if-no-files-found: error

  build-linux:
    # The oldest supported Ubuntu, so the binary runs on distros with an older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      # The tag must be "v" plus APP_VERSION in CMakeLists.txt, e.g. v0.1.0-alpha.
      - name: Check tag matches version
        run: |
          version=$(sed -n 's/^set(APP_VERSION "\([^"]*\)")/\1/p' CMakeLists.txt)
          if [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "Tag ${{ github.ref_name }} does not match APP_VERSION $version in CMakeLists.txt" >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libusb-1.0-0-dev libfontconfig-dev libx11-dev libxext-dev libxft-dev \
            libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev libpango1.0-dev libcairo2-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev libdbus-1-dev libgtk-3-dev

      - name: Build
        run: ./build.sh

      - name: Build tests
        run: cmake --build build/linux --target bridge-tests

      - name: Run tests
        run: ./build/linux/bridge-tests

      - name: Name archive
        run: mv dist/software-ess-adapter.tar.gz "dist/software-ess-adapter-${{ github.ref_name }}-linux-x64.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: build-linux-x64
          path: dist/software-ess-adapter-${{ github.ref_name }}-linux-x64.tar.gz
          if-no-files-found: error

  release:
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ''
