name: Validate build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      # MSVC, plus the CMake and Ninja that ship with Visual Studio, on PATH.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: ./build.ps1

      - name: Build tests
        run: cmake --build build/msvc --target bridge-tests

      - name: Run tests
        run: ./build/msvc/bridge-tests.exe

  build-linux:
    # The oldest supported Ubuntu, so the binary runs on distros with an older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libusb-1.0-0-dev libfontconfig-dev libx11-dev libxext-dev libxft-dev \
            libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev libpango1.0-dev libcairo2-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev libdbus-1-dev libgtk-3-dev

      - name: Build
        run: ./build.sh

      - name: Build tests
        run: cmake --build build/linux --target bridge-tests

      - name: Run tests
        run: ./build/linux/bridge-tests
